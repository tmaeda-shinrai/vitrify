name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          # Autentica a resolução da release "latest" para não bater no rate limit
          # da API do GitHub nos runners (causava "rate limit exceeded" no job rls).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Supabase (aplica migrations + seed)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      - name: RLS tests
        run: pnpm test:rls
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Stop Supabase
        if: always()
        run: supabase stop

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Supabase (aplica migrations + seed)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      - name: Install Playwright (chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        # O dev server (webServer do Playwright) já aponta para o Supabase local
        # via playwright.config; o helper pg lê SUPABASE_DB_URL daqui.
        run: pnpm test:e2e
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop

<!doctype html>
<html lang="pt-BR">
  <body
    style="margin: 0; padding: 24px; background: #f4f4f5; font-family: Arial, Helvetica, sans-serif; color: #18181b"
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px"
    >
      <tr>
        <td>
          <h1 style="margin: 0 0 8px; font-size: 22px; color: #7c3aed">Vitrinio</h1>
          <h2 style="margin: 0 0 16px; font-size: 18px">Redefinição de senha</h2>
          <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.5">
            Recebemos um pedido para redefinir a senha da sua conta. Clique no botão abaixo para
            escolher uma nova senha. O link expira em 1 hora e só pode ser usado uma vez.
          </p>
          <p style="margin: 0 0 24px">
            <a
              href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/redefinir-senha"
              style="display: inline-block; background: #7c3aed; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: bold"
              >Redefinir senha</a
            >
          </p>
          <p style="margin: 0; font-size: 13px; color: #71717a; line-height: 1.5">
            Se você não pediu a redefinição, ignore este e-mail — sua senha continua a mesma.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
